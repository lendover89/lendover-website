<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>דו״ח זכויות בנייה לחלקה — IsraMap</title>
  <style>
    :root { --blue:#2563eb; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "Segoe UI", Arial, sans-serif; color:var(--ink); background:var(--bg); line-height:1.6; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 24px 18px 60px; }
    header h1 { font-size: 1.5rem; margin:0 0 4px; }
    header .sub { color:var(--muted); margin-bottom:18px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
    .plan-title { font-weight:700; font-size:1.1rem; }
    .badge { display:inline-block; font-size:.8rem; padding:2px 10px; border-radius:999px; background:#eef2ff; color:var(--blue); margin-inline-start:8px; }
    .badge.low { background:#fef2f2; color:#dc2626; } .badge.medium { background:#fffbeb; color:#d97706; } .badge.high { background:#ecfdf5; color:#059669; }
    .status { color:var(--muted); font-size:.9rem; margin:2px 0 10px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap:8px; margin:10px 0; }
    .kv { background:var(--bg); border-radius:8px; padding:8px 10px; }
    .kv .k { font-size:.78rem; color:var(--muted); } .kv .v { font-weight:700; font-size:1.05rem; }
    h3 { font-size:.95rem; margin:16px 0 6px; border-top:1px solid var(--line); padding-top:12px; }
    table { width:100%; border-collapse:collapse; font-size:.9rem; }
    th,td { text-align:right; padding:6px 8px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-weight:600; }
    ul { margin:6px 0; padding-inline-start:20px; }
    li { margin:3px 0; }
    .raw { color:var(--muted); font-size:.85rem; }
    .note { color:var(--muted); font-size:.85rem; margin-top:10px; }
    .loading,.error { text-align:center; padding:40px; color:var(--muted); }
    .error { color:#dc2626; }
    .brand-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; background:#121619; border-radius:10px; padding:12px 18px; margin-bottom:16px; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .brand-bar img { height:40px; width:auto; display:block; }
    .export-btn { display:inline-flex; align-items:center; gap:6px; background:var(--blue); color:#fff; border:0; border-radius:8px; padding:9px 16px; font-size:.95rem; font-weight:600; cursor:pointer; font-family:inherit; }
    .export-btn:hover { background:#1d4ed8; }
    @media print { body{background:#fff;} .card{box-shadow:none;} .no-print{display:none !important;} }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand-bar">
      <img src="isramap-logo.png" alt="IsraMap">
      <button class="export-btn no-print" type="button" onclick="window.print()">⬇ ייצוא ל-PDF</button>
    </div>
    <h1>דו״ח זכויות בנייה לחלקה</h1>
    <div class="sub" id="sub">טוען…</div>
  </header>
  <div id="content"><div class="loading">טוען נתונים…</div></div>
  <div class="note">המקור: מאגר זכויות הבנייה של IsraMap (חילוץ אוטומטי). אינו תחליף לבדיקה סטטוטורית מול התקנון ונספחי התכנית.</div>
</div>
<script src="rights-render.js?v=20260706b"></script>
<script>
  const GROUNDWATER_API = 'https://groundwater.lendover.co.il';
  const params = new URLSearchParams(location.search);
  const gush = params.get('gush'), helka = params.get('helka');
  const esc = RightsRender.reportEsc;
  async function load() {
    if (!gush || !helka) { document.getElementById('content').innerHTML = '<div class="error">חסר גוש/חלקה בכתובת.</div>'; return; }
    document.getElementById('sub').textContent = 'גוש ' + gush + ' · חלקה ' + helka;
    try {
      const r = await fetch(GROUNDWATER_API + '/api/planning/parcel-rights?gush=' + encodeURIComponent(gush) + '&helka=' + encodeURIComponent(helka), { credentials: 'include' });
      const d = await r.json();
      if (d && d.error_kind) {
        if (d.error_kind === 'not_found') {
          document.getElementById('content').innerHTML = '<div class="error">לא נמצאו נתוני חלקה במאגר.</div>';
          return;
        }
        const kindMsg = d.error_kind === 'timeout' ? 'חישוב הזכויות התארך מדי.' : 'שירות הזכויות אינו זמין כרגע.';
        document.getElementById('content').innerHTML = '<div class="error">' + kindMsg +
          ' <a href="javascript:location.reload()">נסה שוב</a></div>';
        return;
      }
      if (!r.ok || !d || !d.available || !Array.isArray(d.plans) || !d.plans.length) {
        document.getElementById('content').innerHTML = '<div class="error">' + esc((d && d.message) || 'לא נמצאו זכויות לחלקה.') + '</div>';
        return;
      }
      document.getElementById('sub').textContent = 'גוש ' + gush + ' · חלקה ' + helka + (d.parcel_area_m2 ? ' · ' + d.parcel_area_m2 + ' מ"ר · ' : ' · ') + d.plans.length + ' תכניות חלות';
      document.getElementById('content').innerHTML = d.plans.map((p) => RightsRender.reportCard(p)).join('');
    } catch (e) {
      document.getElementById('content').innerHTML = '<div class="error">שגיאה בטעינת הנתונים.</div>';
    }
  }
  load();
</script>
</body>
</html>
