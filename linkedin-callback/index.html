<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>LinkedIn OAuth Callback</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    max-width: 720px;
    margin: 40px auto;
    padding: 24px;
    background: #f3f2ef;
    color: #000;
    line-height: 1.6;
  }
  .card {
    background: #fff;
    border-radius: 8px;
    padding: 32px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.08);
  }
  h1 { color: #0a66c2; margin-top: 0; }
  .ok { color: #057642; }
  .err { color: #b24020; }
  .code-box {
    background: #f3f2ef;
    border: 1px solid #d0d0d0;
    border-radius: 4px;
    padding: 16px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    word-break: break-all;
    margin: 12px 0;
    direction: ltr;
    text-align: left;
  }
  button {
    background: #0a66c2;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #084d94; }
  .hint {
    background: #eef4fb;
    border-right: 4px solid #0a66c2;
    padding: 12px 16px;
    margin: 16px 0;
    border-radius: 4px;
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="card">
<h1>LinkedIn OAuth Callback</h1>
<div id="content">טוען...</div>
</div>

<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const state = params.get('state');
  const error = params.get('error');
  const errorDesc = params.get('error_description');
  const content = document.getElementById('content');

  if (error) {
    content.innerHTML =
      '<h2 class="err">שגיאה</h2>' +
      '<p><strong>' + escapeHtml(error) + '</strong></p>' +
      '<p>' + escapeHtml(errorDesc || '') + '</p>';
    return;
  }

  if (!code) {
    content.innerHTML =
      '<p>דף זה מקבל אישור מ-LinkedIn אחרי OAuth flow.</p>' +
      '<p>אם הגעת לכאן ישירות — אין מה לעשות. צריך להתחיל את התהליך מהאגנט.</p>';
    return;
  }

  content.innerHTML =
    '<h2 class="ok">✓ אישור התקבל</h2>' +
    '<div class="hint">העתק את הקוד למטה והדבק לאגנט שלך. הקוד תקף ל-30 שניות בלבד.</div>' +
    '<p><strong>Authorization Code:</strong></p>' +
    '<div class="code-box" id="codeBox">' + escapeHtml(code) + '</div>' +
    '<button onclick="copyCode()">העתק קוד</button>' +
    (state ? '<p style="margin-top:24px;"><strong>State:</strong></p><div class="code-box">' + escapeHtml(state) + '</div>' : '');

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  window.copyCode = function() {
    navigator.clipboard.writeText(code).then(() => {
      const btn = document.querySelector('button');
      const orig = btn.textContent;
      btn.textContent = '✓ הועתק';
      setTimeout(() => btn.textContent = orig, 2000);
    });
  };
})();
</script>
</body>
</html>
