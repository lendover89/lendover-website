<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Facebook OAuth Callback</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    max-width: 760px;
    margin: 40px auto;
    padding: 24px;
    background: #f0f2f5;
    color: #1c1e21;
    line-height: 1.6;
  }
  .card {
    background: #fff;
    border-radius: 8px;
    padding: 32px;
    box-shadow: 0 1px 2px rgba(0,0,0,.12);
  }
  h1 { color: #1877f2; margin-top: 0; }
  .ok { color: #057642; }
  .err { color: #b00020; }
  .hint {
    background: #eef4ff;
    border-right: 4px solid #1877f2;
    padding: 12px 16px;
    margin: 16px 0;
    border-radius: 4px;
    font-size: 14px;
  }
  .warn {
    background: #fff4e5;
    border-right: 4px solid #f5a623;
    padding: 12px 16px;
    margin: 16px 0;
    border-radius: 4px;
    font-size: 14px;
  }
  textarea, .code-box {
    width: 100%;
    box-sizing: border-box;
    background: #f5f6f7;
    border: 1px solid #ccd0d5;
    border-radius: 4px;
    padding: 14px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    direction: ltr;
    text-align: left;
    word-break: break-all;
  }
  textarea { min-height: 110px; resize: vertical; }
  button {
    background: #1877f2;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 12px;
  }
  button:hover { background: #166fe5; }
  .muted { color: #606770; font-size: 13px; }
</style>
</head>
<body>
<div class="card">
  <h1>Facebook OAuth Callback</h1>
  <div id="content">טוען...</div>
</div>

<script>
(function() {
  const query = new URLSearchParams(window.location.search);
  const hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
  const token = hash.get("access_token") || query.get("access_token");
  const expiresIn = hash.get("expires_in") || query.get("expires_in");
  const state = hash.get("state") || query.get("state");
  const code = query.get("code");
  const error = query.get("error") || hash.get("error");
  const errorDesc = query.get("error_description") || hash.get("error_description");
  const content = document.getElementById("content");

  if (error) {
    content.innerHTML =
      '<h2 class="err">שגיאה</h2>' +
      '<p><strong>' + escapeHtml(error) + '</strong></p>' +
      '<p>' + escapeHtml(errorDesc || '') + '</p>';
    return;
  }

  if (token) {
    content.innerHTML =
      '<h2 class="ok">אישור התקבל</h2>' +
      '<div class="warn">זהו מפתח גישה לעמוד. אל תפרסם אותו ואל תשאיר אותו פתוח במחשב ציבורי.</div>' +
      '<p><strong>Access Token:</strong></p>' +
      '<textarea id="tokenBox" readonly>' + escapeHtml(token) + '</textarea>' +
      '<button onclick="copyToken()">העתק token</button>' +
      (expiresIn ? '<p class="muted">expires_in: ' + escapeHtml(expiresIn) + ' שניות</p>' : '') +
      (state ? '<p><strong>State:</strong></p><div class="code-box">' + escapeHtml(state) + '</div>' : '');
    return;
  }

  if (code) {
    content.innerHTML =
      '<h2 class="ok">Authorization code התקבל</h2>' +
      '<div class="hint">אם ה-flow הוגדר כ-code, העתק את הקוד לאגנט כדי להחליף אותו ל-token בצד שרת.</div>' +
      '<div class="code-box" id="codeBox">' + escapeHtml(code) + '</div>' +
      '<button onclick="copyCode()">העתק קוד</button>' +
      (state ? '<p><strong>State:</strong></p><div class="code-box">' + escapeHtml(state) + '</div>' : '');
    return;
  }

  content.innerHTML =
    '<p>דף זה מקבל אישור מ-Facebook אחרי OAuth flow.</p>' +
    '<p>אם הגעת לכאן ישירות, צריך להתחיל את התהליך דרך קישור ההרשאה שהאגנט מייצר.</p>';

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  window.copyToken = function() {
    navigator.clipboard.writeText(token).then(() => flashButton('הועתק'));
  };
  window.copyCode = function() {
    navigator.clipboard.writeText(code).then(() => flashButton('הועתק'));
  };
  function flashButton(text) {
    const btn = document.querySelector('button');
    const orig = btn.textContent;
    btn.textContent = text;
    setTimeout(() => btn.textContent = orig, 2000);
  }
})();
</script>
</body>
</html>
